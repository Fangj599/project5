<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Does Spring Look Like?</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { font-family: "DM Sans", Arial, sans-serif; }
.scene { position: relative; height: 100vh; overflow: hidden; background: #263329; }
.scene-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  cursor: pointer;
  background: center / cover no-repeat;
}
.scene-image::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.12); }
.center-button {
  position: absolute;
  z-index: 2;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(68vw, 680px);
  min-height: 150px;
  padding: 28px 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(255,249,242,.95);
  border-radius: 100px;
  color: #263329;
  background: rgba(255,249,242,.82);
  backdrop-filter: blur(8px);
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(34px, 5vw, 64px);
  line-height: 1.05;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
}
.center-button:focus-visible { outline: 4px solid #263329; outline-offset: 6px; }
.home-link {
  position: absolute;
  z-index: 3;
  left: 24px;
  bottom: 24px;
  padding: 10px 20px;
  border: 1px solid rgba(255,249,242,.9);
  border-radius: 999px;
  color: #fff9f2;
  background: rgba(0,0,0,.28);
  font-size: 16px;
  text-decoration: none;
  backdrop-filter: blur(5px);
}
</style>
</head>
<body>
<main class="scene">
  <button class="scene-image" id="sceneImage" type="button" aria-label="Show the next spring photograph"></button>
  <button class="center-button" id="sceneTitle" type="button">Blooming Flowers</button>
  <a class="home-link" href="index.html">Home</a>
</main>
<script>
const scenes = [
  { image: "images/bloomingflowers.jpg", title: "Blooming Flowers" },
  { image: "images/freshgreenleaves.jpg", title: "Fresh Green Leaves" },
  { image: "images/brightsunlight.jpg", title: "Brighter Sunlight" },
  { image: "images/colorfulnature.jpg", title: "Colorful Nature" }
];
let current = 0;
const image = document.getElementById("sceneImage");
const title = document.getElementById("sceneTitle");
function showScene() {
  image.style.backgroundImage = `url("${scenes[current].image}")`;
  title.textContent = scenes[current].title;
}
function nextScene() {
  current = (current + 1) % scenes.length;
  showScene();
}
image.addEventListener("click", nextScene);
title.addEventListener("click", nextScene);
showScene();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring — Seeing</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { font-family: "DM Sans", Arial, sans-serif; }
.scene {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: #263329;
}
.scene-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  padding: 0;
  cursor: pointer;
  background: center center / cover no-repeat;
}
.scene-image::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.12);
}
.center-button {
  position: absolute;
  z-index: 2;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(68vw, 680px);
  min-height: 150px;
  padding: 28px 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(255,249,242,.95);
  border-radius: 100px;
  color: #263329;
  background: rgba(255,249,242,.82);
  backdrop-filter: blur(8px);
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(34px, 5vw, 64px);
  line-height: 1.05;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
}
.center-button:focus-visible {
  outline: 4px solid #263329;
  outline-offset: 6px;
}
</style>
</head>
<body>
<main class="scene">
  <button class="scene-image" id="sceneImage" aria-label="Show the next spring photograph"></button>
  <button class="center-button" id="sceneTitle" type="button">Blooming Flowers</button>
</main>
<script>
const scenes = [
  { image: "images/bloomingflowers.jpg", title: "Blooming Flowers" },
  { image: "images/freshgreenleaves.jpg", title: "Fresh Green Leaves" },
  { image: "images/brightsunlight.jpg", title: "Brighter Sunlight" },
  { image: "images/colorfulnature.jpg", title: "Colorful Nature" }
];
let current = 0;
const imageArea = document.getElementById("sceneImage");
const titleButton = document.getElementById("sceneTitle");
function showScene() {
  imageArea.style.backgroundImage = `url("${scenes[current].image}")`;
  titleButton.textContent = scenes[current].title;
}
function nextScene() {
  current = (current + 1) % scenes.length;
  showScene();
}
imageArea.addEventListener("click", nextScene);
titleButton.addEventListener("click", nextScene);
showScene();
</script>
</body>
</html>

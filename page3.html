<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring — Seeing Gallery</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; }
body { overflow: hidden; background: #fff9f2; }
.gallery {
  width: 100%;
  height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 0;
}
.gallery img {
  display: block;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  object-fit: cover;
}
</style>
</head>
<body>
<main class="gallery">
  <img src="images/bloomingflowers.jpg" alt="Blooming flowers">
  <img src="images/freshgreenleaves.jpg" alt="Fresh green leaves">
  <img src="images/brightsunlight.jpg" alt="Brighter sunlight">
  <img src="images/colorfulnature.jpg" alt="Colorful nature">
</main>
</body>
</html>

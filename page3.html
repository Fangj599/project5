<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Does Spring Look Like?</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #fff9f2;
}

.gallery {
  width: 100%;
  height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}

.gallery img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.home-link {
  position: fixed;
  left: 24px;
  bottom: 24px;
  padding: 10px 20px;
  border: 1px solid rgba(255,249,242,.9);
  border-radius: 999px;
  color: #fff9f2;
  background: rgba(0,0,0,.42);
  font: 16px "DM Sans", Arial, sans-serif;
  text-decoration: none;
}
</style>
</head>

<body>

<main class="gallery">
  <img src="bloomingflowers.jpg" alt="">
  <img src="freshgreenleaves.jpg" alt="">
  <img src="brightsunlight.jpg" alt="">
  <img src="colorfulnature.jpg" alt="">
</main>

<a class="home-link" href="index.html">Home</a>

</body>
</html>

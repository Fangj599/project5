
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
}

.scene {
    width: 100%;
    height: 100vh;
    min-height: 500px;
    position: relative;
    overflow: hidden;
    background: #c5d9df;
}

h1 {
    position: absolute;
    top: 8%;
    left: 7%;
    z-index: 5;
    margin: 0;
    font-family: "Fraunces", Georgia, serif;
    font-size: clamp(42px, 5vw, 72px);
    font-weight: 700;
    color: #344a45;
}

.sun {
    position: absolute;
    top: 18%;
    right: 15%;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #f1d68d;
    display: block;
    z-index: 5;
}

.field {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 43%;
    background: #b6b17c;
    border-radius: 50% 50% 0 0 / 10% 10% 0 0;
}

.grass {
    position: absolute;
    bottom: 35%;
    left: 0;
    width: 100%;
    height: 18%;
    display: flex;
    justify-content: space-around;
    align-items: end;
}

.grass span {
    width: 3px;
    height: 35px;
    background: #89936b;
    border-radius: 100% 0;
    transform: rotate(-15deg);
}

.grass span:nth-child(2n) {
    height: 50px;
    transform: rotate(15deg);
}

.grass span:nth-child(3n) {
    height: 25px;
}

.bud {
    position: absolute;
    bottom: 39%;
    left: 25%;
    width: 13px;
    height: 19px;
    border-radius: 80% 20% 70% 30%;
    background: #d5a9ad;
    transform: rotate(-30deg);
}

.bud.two {
    left: 48%;
    bottom: 42%;
    transform: rotate(20deg);
}

.bud.three {
    left: 76%;
    bottom: 37%;
}

</style>
</head>

<body>
<main class="scene">

    <h1>What Does Spring Look Like?</h1>

    <a href="bloom.html" class="sun"></a>

    <div class="field"></div>

    <div class="grass">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>

    <div class="bud"></div>
    <div class="bud two"></div>
    <div class="bud three"></div>

</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Does Spring Look Like?</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "DM Sans", Arial, sans-serif;
}

.home {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff9f2;
  background: url("homepage.jpg") center / cover no-repeat;
}

.home::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,.06) 55%, rgba(0,0,0,.18));
}

.content {
  position: relative;
  width: 90%;
  max-width: 760px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

h1 {
  margin: 0 0 38px;
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(64px, 8vw, 112px);
  line-height: .98;
  font-weight: 700;
  letter-spacing: -.04em;
  text-shadow: 0 2px 18px rgba(0,0,0,.18);
}

.links {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

.links a, .bottom-link {
  min-width: 270px;
  padding: 11px 28px;
  border: 1.5px solid rgba(255,249,242,.9);
  border-radius: 999px;
  color: #fff9f2;
  background: rgba(255,249,242,.12);
  font-size: clamp(18px, 1.6vw, 23px);
  line-height: 1.2;
  text-decoration: none;
}

.links .large {
  min-width: 360px;
  padding: 19px 34px;
  border-width: 3px;
  background: rgba(255,249,242,.28);
  font-size: clamp(30px, 3vw, 42px);
  font-weight: 700;
}

.bottom-link {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
}
</style>
</head>

<body>
<main class="home">
  <div class="content">
    <h1>Spring</h1>

    <nav class="links">
      <a class="large" href="page2.html">Seeing Spring</a>
      <a href="#">Sound</a>
      <a href="#">Scent</a>
      <a href="#">Taste</a>
      <a href="#">Feel</a>
    </nav>
  </div>

  
  <a class="bottom-link" href="page3.html">What does spring look like?</a>
</main>
</body>
</html>

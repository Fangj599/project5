<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Does Spring Look Like?</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: "DM Sans", Arial, sans-serif; }
.home {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff9f2;
  background: url("images/cover.jpg") center / cover no-repeat;
}
.home::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(0,0,0,.06) 55%, rgba(0,0,0,.18));
}
.home-content {
  position: relative;
  z-index: 1;
  width: min(90vw, 760px);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
h1 {
  margin: 0 0 38px;
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(64px, 8vw, 112px);
  line-height: .98;
  font-weight: 700;
  letter-spacing: -.04em;
  text-shadow: 0 2px 18px rgba(0,0,0,.18);
}
.links { display: flex; flex-direction: column; align-items: center; gap: 15px; }
.links a {
  min-width: 270px;
  padding: 11px 28px;
  border: 1.5px solid rgba(255,249,242,.9);
  border-radius: 999px;
  color: #fff9f2;
  background: rgba(255,249,242,.12);
  backdrop-filter: blur(5px);
  font-size: clamp(18px, 1.6vw, 23px);
  line-height: 1.2;
  text-decoration: none;
}
.links a.see {
  min-width: 360px;
  padding: 19px 34px;
  border-width: 3px;
  background: rgba(255,249,242,.28);
  font-size: clamp(30px, 3vw, 42px);
  font-weight: 700;
}
</style>
</head>
<body>
<main class="home">
  <div class="home-content">
    <h1>Spring</h1>
    <nav class="links" aria-label="Spring sections">
      <a class="see" href="page2.html">Seeing Spring</a>
      <a href="page3.html">What does spring look like?</a>
      <a href="#">Sound</a>
      <a href="#">Scent</a>
      <a href="#">Taste</a>
      <a href="#">Feel</a>
    </nav>
  </div>
</main>
</body>
</html>
